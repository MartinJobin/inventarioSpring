<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Formulario Producto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 th:text="${producto.id == null} ? 'Registrar Producto' : 'Editar Producto'"></h2>

<form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="mt-3">
  <input type="hidden" th:field="*{id}" />

  <div class="mb-3">
    <label class="form-label">Nombre:</label>
    <input type="text" th:field="*{nombre}" class="form-control" required>
  </div>

  <!-- SELECT DE CATEGORÍA (Relación Muchos a Uno) -->
  <div class="mb-3">
    <label class="form-label">Categoría:</label>
    <select th:field="*{categoria}" class="form-select" required>
      <option value="">Seleccione una categoría</option>
      <option th:each="cat : ${categorias}"
              th:value="${cat.id}"
              th:text="${cat.nombre}"></option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Precio:</label>
    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Cantidad:</label>
    <input type="number" th:field="*{cantidad}" class="form-control" required>
  </div>

  <button type="submit" class="btn btn-success">Guardar</button>
  <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
</form>
</body>
</html>
