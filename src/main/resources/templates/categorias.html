<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Categorías</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 class="mb-4">Listado de Categorías</h2>

<div class="d-flex justify-content-between mb-3">
  <!-- Buscador de Categorías -->
  <form th:action="@{/categorias}" method="get" class="d-flex gap-2">
    <input type="text" name="buscar" class="form-control" placeholder="Buscar categoría..." th:value="${buscar}">
    <button type="submit" class="btn btn-outline-primary">Buscar</button>
  </form>
  <div>
    <a th:href="@{/categorias/nuevo}" class="btn btn-primary">Nueva Categoría</a>
    <a th:href="@{/productos}" class="btn btn-secondary">Volver a Productos</a>
  </div>
</div>

<table class="table table-bordered table-striped">
  <thead class="table-dark">
  <tr><th>ID</th><th>Nombre</th></tr>
  </thead>
  <tbody>
  <tr th:if="${#lists.isEmpty(categorias)}">
    <td colspan="2" class="text-center">No se encontraron categorías.</td>
  </tr>
  <tr th:each="cat : ${categorias}">
    <td th:text="${cat.id}"></td>
    <td th:text="${cat.nombre}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
