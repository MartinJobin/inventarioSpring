<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 class="mb-4">Detalle del Producto</h2>
<div class="card">
  <div class="card-header bg-primary text-white">
    <h5 class="card-title mb-0" th:text="${producto.nombre}"></h5>
  </div>
  <div class="card-body">
    <p><strong>ID:</strong> <span th:text="${producto.id}"></span></p>
    <p><strong>Categoría:</strong> <span th:text="${producto.categoria.nombre}"></span></p>
    <p><strong>Precio:</strong> <span th:text="'$' + ${producto.precio}"></span></p>
    <p><strong>Cantidad:</strong> <span th:text="${producto.cantidad}"></span></p>
  </div>
</div>
<a th:href="@{/productos}" class="btn btn-secondary mt-3">Volver al inventario</a>
</body>
</html>
